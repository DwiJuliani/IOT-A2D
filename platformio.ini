; PlatformIO Project Configuration File
; Praktikum Minggu 1 - Teknologi IoT FT UNIB
; Toolchain: ESP32 DevKit C v4 + Framework Arduino

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Dependensi library yang diunduh otomatis oleh PlatformIO
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
